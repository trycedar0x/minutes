name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS app
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # `git describe` (used for the default APP_VERSION) needs tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          swift --version
          uv --version

      - name: Run unit tests
        run: make test

      - name: Package app
        env:
          # On a release, the tag wins so the app reports the released version.
          APP_VERSION: ${{ github.event.release.tag_name }}
          APP_BUILD: ${{ github.run_number }}
        run: make package

      - name: Upload packaged app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Minutes-macos-arm64
          path: dist/Minutes-macos-arm64.zip
          if-no-files-found: error

      - name: Attach packaged app to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            dist/Minutes-macos-arm64.dmg \
            dist/Minutes-macos-arm64.zip \
            --clobber
